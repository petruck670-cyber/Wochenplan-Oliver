<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wochenplan Oliver</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #334155; max-width: 800px; margin: 20px auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1e293b; font-weight: 600; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #475569; }
        select, input[type="text"], input[type="password"] { width: 100%; padding: 9px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; font-size: 14px; }
        button { background-color: #3b82f6; color: white; border: none; padding: 9px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        button:hover { background-color: #2563eb; }
        .add-task-btn { background-color: #10b981; padding: 5px 10px; font-size: 12px; margin-top: 6px; }
        .remove-slot-btn { background-color: #ef4444; padding: 7px 11px; font-size: JSONID; }
        .delete-btn { background-color: #ef4444; padding: 4px 8px; font-size: 12px; margin-left: 10px; }
        .task-list-item { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 8px 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; border-radius: 6px; }
        .task-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
        details { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; padding: 12px; }
        summary { font-weight: 600; color: #1e293b; cursor: pointer; font-size: 16px; outline: none; }
        .day-content { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e8f0; }
        .child-view-table { width: 100%; border-collapse: collapse; margin-top: 6px; background: #fff; }
        .child-view-table td { border: 1px solid #f1f5f9; padding: 10px 12px; text-align: left; }
        .task-cell { width: 100%; font-size: 15px; color: #334155; }
        .task-cell input { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; vertical-align: middle; accent-color: #3b82f6; }
        tr.done { background-color: #f1f5f9; color: #94a3b8; text-decoration: line-through; }
        .admin-panel { background: #f8fafc; border: 1px solid #e2e8f0; padding: 18px; border-radius: 8px; margin-bottom: 20px; }
        .sync-status { font-size: 12px; color: #059669; margin-top: 5px; font-weight: 600; }
    </style>
</head>
<body>

    <h2 id="pageTitle">📋 Wochenplan</h2>

    <!-- ADMIN-BEREICH -->
    <div class="admin-panel" id="adminPanel">
        <h3>⚙️ Admin-Modus</h3>
        <p style="font-size: 13px; color: #64748b;">Bitte PIN eingeben:</p>
        <div id="loginBox" style="display: flex; gap: 10px; max-width: 300px;">
            <input type="password" id="adminPin" placeholder="PIN eingeben..." maxlength="4">
            <button onclick="checkAdminLogin()" style="margin-top: 0;">Entsperren</button>
        </div>

        <div id="editArea" style="display: none; margin-top: 15px;">
            <label>Name des Kindes:</label>
            <input type="text" id="childNameInput" value="Oliver" oninput="saveAdminChanges()">
            
            <div style="background: #ffffff; border: 1px solid #e2e8f0; padding: 12px; margin-top: 15px; border-radius: 6px;">
                <h4 style="margin-top: 0; color: #1e293b;">Aufgaben-Liste verwalten</h4>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="neueAufgabeInput" placeholder="Neue Aufgabe...">
                    <button onclick="aufgabeHinzufuegen()" style="margin-top: 0;">Hinzufügen</button>
                </div>
                <div id="aufgabenListeContainer" style="max-height: 120px; overflow-y: auto; margin-top: 10px;"></div>
            </div>

            <h4 style="margin: 15px 0 5px 0; color: #1e293b;">Wochentage belegen:</h4>
            <div id="builderContainer"></div>
            
            <div id="syncStatus" class="sync-status">☁️ Cloud-Status: Bereit</div>

            <button onclick="lockAdminMode()" style="background-color: #f97316; margin-top: 15px; width: 100%;">🔒 Bearbeiten beenden</button>
        </div>
    </div>

    <!-- ANSICHT FÜR DAS KIND -->
    <div id="publicViewContainer"></div>

    <script>
        const MASTER_PIN = "1985";
        
        // Fester, eindeutiger Speicher-Link für Olivers Wochenplan
        const STORAGE_URL = "https://api.npoint.io/oliver_wochenplan_v1";

        const wochentage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
        
        let localData = JSON.parse(localStorage.getItem('lokales_backup_oliver')) || {
            child_name: "Oliver",
            shared_aufgaben: ["Spülmaschine", "Schulrucksack aufräumen", "Zimmer aufräumen", "Duschen", "Lernzeit", "Tisch decken"],
            tasks: {},
            checkboxes: {}
        };

        async function initApp() {
            await loadDataFromCloud();
            renderAufgabenManager();
            renderBuilder();
            renderPublicView();
        }

        async function loadDataFromCloud() {
            try {
                let response = await fetch(STORAGE_URL);
                if (response.ok) {
                    let cloudData = await response.json();
                    if (cloudData && cloudData.child_name) {
                        localData = cloudData;
                        localStorage.setItem('lokales_backup_oliver', JSON.stringify(localData));
                    }
                }
            } catch (e) {
                console.log("Nutze lokales Backup");
            }
        }

        async function syncToCloud() {
            let statusEl = document.getElementById('syncStatus');
            if (statusEl) statusEl.innerText = "☁️ Speichert...";

            localStorage.setItem('lokales_backup_oliver', JSON.stringify(localData));

            try {
                await fetch(STORAGE_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(localData)
                });
                if (statusEl) statusEl.innerText = "✅ Live aktualisiert!";
            } catch (e) {
                if (statusEl) statusEl.innerText = "⚠️ Lokal gespeichert";
            }
        }

        async function saveAdminChanges() {
            localData.child_name = document.getElementById('childNameInput').value || "Oliver";
            wochentage.forEach(tag => {
                const slotsContainer = document.getElementById('builder_slots_' + tag);
                if (slotsContainer) {
                    const selects = slotsContainer.querySelectorAll('select');
                    let tasks = [];
                    selects.forEach(sel => { if (sel.value) tasks.push(sel.value); });
                    localData.tasks[tag] = tasks;
                }
            });
            renderPublicView();
            await syncToCloud();
        }

        function checkAdminLogin() {
            if (document.getElementById('adminPin').value === MASTER_PIN) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('editArea').style.display = 'block';
            } else {
                alert("Falscher PIN!");
                document.getElementById('adminPin').value = '';
            }
        }

        function lockAdminMode() {
            document.getElementById('loginBox').style.display = 'flex';
            document.getElementById('editArea').style.display = 'none';
            document.getElementById('adminPin').value = '';
        }

        function renderAufgabenManager() {
            const container = document.getElementById('aufgabenListeContainer');
            container.innerHTML = '';
            localData.shared_aufgaben.forEach(function(aufgabe, index) {
                let item = document.createElement('div');
                item.className = 'task-list-item';
                item.innerHTML = '<span>' + aufgabe + '</span><button class="delete-btn" onclick="aufgabeLoeschen(' + index + ')">Löschen</button>';
                container.appendChild(item);
            });
        }

        async function aufgabeHinzufuegen() {
            const input = document.getElementById('neueAufgabeInput');
            const val = input.value.trim();
            if (val && localData.shared_aufgaben.indexOf(val) === -1) {
                localData.shared_aufgaben.push(val);
                input.value = '';
                renderAufgabenManager();
                renderBuilder();
                await syncToCloud();
            }
        }

        async function aufgabeLoeschen(index) {
            localData.shared_aufgaben.splice(index, 1);
            renderAufgabenManager();
            renderBuilder();
            await syncToCloud();
        }

        function renderBuilder() {
            const container = document.getElementById('builderContainer');
            container.innerHTML = '';
            wochentage.forEach(function(tag) {
                let details = document.createElement('details');
                details.innerHTML = '<summary>📅 ' + tag + '</summary>' +
                                    '<div class="day-content" id="builder_slots_' + tag + '"></div>' +
                                    '<button type="button" class="add-task-btn" onclick="addSlot(\'' + tag + '\')">+ Aufgabe hinzufügen</button>';
                container.appendChild(details);
            });

            wochentage.forEach(function(tag) {
                let savedTasks = localData.tasks[tag] || [""];
                let slotsContainer = document.getElementById('builder_slots_' + tag);
                slotsContainer.innerHTML = '';
                savedTasks.forEach(val => { slotsContainer.innerHTML += createSlotHtml(tag, val); });
            });
            document.getElementById('childNameInput').value = localData.child_name || "Oliver";
            document.getElementById('pageTitle').innerText = "📋 Wochenplan für " + (localData.child_name || "Oliver");
        }

        function createSlotHtml(tag, selectedVal) {
            let optionsHtml = '<option value="">-- Aufgabe wählen --</option>';
            localData.shared_aufgaben.forEach(function(a) {
                let sel = (a === selectedVal) ? ' selected' : '';
                optionsHtml += '<option value="' + a + '"' + sel + '>' + a + '</option>';
            });
            return '<div class="task-row"><select onchange="saveAdminChanges()"> ' + optionsHtml + '</select>' +
                   '<button type="button" class="remove-slot-btn" onclick="removeSlot(this)">X</button></div>';
        }

        function addSlot(tag) {
            const slotsContainer = document.getElementById('builder_slots_' + tag);
            let selects = slotsContainer.querySelectorAll('select');
            let currentValues = [];
            selects.forEach(s => currentValues.push(s.value));
            currentValues.push("");
            let html = '';
            currentValues.forEach(val => { html += createSlotHtml(tag, val); });
            slotsContainer.innerHTML = html;
            saveAdminChanges();
        }

        function removeSlot(btn) {
            const row = btn.parentElement;
            if (row.parentElement.children.length > 1) {
                row.remove();
                saveAdminChanges();
            } else {
                alert("Mindestens ein Feld pro Tag beibehalten.");
            }
        }

        async function renderPublicView() {
            await loadDataFromCloud();
            const container = document.getElementById('publicViewContainer');
            let childName = localData.child_name || "Oliver";
            document.getElementById('pageTitle').innerText = "📋 Wochenplan für " + childName;

            let html = '<h3 style="color: #1e293b; border-bottom: 2px solid #3b82f6; padding-bottom: 5px;">Wochenplan für ' + childName + '</h3>';

            wochentage.forEach(function(tag) {
                let tasks = localData.tasks[tag] || [];
                if (tasks.length === 0) tasks = ["Keine Aufgaben für heute"];

                html += '<details open><summary>📅 ' + tag + '</summary><div class="day-content"><table class="child-view-table"><tbody>';

                tasks.forEach(function(task, index) {
                    let uniqueId = tag + '_' + index;
                    let taskDisplayHtml = '<span>' + task + '</span>';
                    
                    if (task.toLowerCase() === 'lernzeit') {
                        taskDisplayHtml += '<a href="https://petruck670-cyber.github.io/Lernapp/Lernapp.html?start=15" target="_blank" style="background:#3b82f6; color:white; padding:4px 8px; text-decoration:none; border-radius:4px; font-size:12px; margin-left:8px; display:inline-block;">🚀 Lernapp</a>';
                    } else if (task.toLowerCase() === 'zimmer aufräumen') {
                        taskDisplayHtml += '<a href="https://petruck670-cyber.github.io/Zimmer/aufr%C3%A4umen.html" target="_blank" style="background:#f97316; color:white; padding:4px 8px; text-decoration:none; border-radius:4px; font-size:12px; margin-left:8px; display:inline-block;">🧹 Aufräum-App</a>';
                    }

                    let isChecked = localData.checkboxes && localData.checkboxes[uniqueId] ? 'checked' : '';
                    html += '<tr id="row_' + uniqueId + '" class="' + (isChecked ? 'done' : '') + '"><td class="task-cell">' +
                            '<input type="checkbox" id="' + uniqueId + '" ' + isChecked + ' onchange="toggleTask(\'' + uniqueId + '\')"> ' +
                            taskDisplayHtml + '</td></tr>';
                });
                html += '</tbody></table></div></details>';
            });
            container.innerHTML = html;
        }

        async function toggleTask(id) {
            let cb = document.getElementById(id);
            let row = document.getElementById("row_" + id);
            if (!localData.checkboxes) localData.checkboxes = {};
            
            if (cb.checked) {
                row.classList.add("done");
                localData.checkboxes[id] = true;
            } else {
                row.classList.remove("done");
                localData.checkboxes[id] = false;
            }
            await syncToCloud();
        }

        initApp();
    </script>
</body>
</html>
